yaml
services:
  - type: web
    name: resume-agent
    env: python
    buildCommand: pip install -r requirements.txt && python initialize.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: TOKEN_PARALLELISM
        value: "false"
